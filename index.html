    <title>Cardápio Digital</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Cardápio Digital</h1>
    </header>

    <main>

        <section class="inicio">
            <h2>DELICIAS DA DRI</h2>
            <p>Escolha seus produtos e monte seu pedido.</p>
        </section>

        <section class="cardapio">

            <h2>Cardápio</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar produto..."
            >

            <select id="filtro">
                <option value="todos">Todas as categorias</option>
                <option value="Entradas">Entradas</option>
                <option value="Prato Principal">Prato Principal</option>
                <option value="Sobremesas">Sobremesas</option>
                <option value="Bebidas">Bebidas</option>
                <option value="Carta de Vinhos">Carta de Vinhos</option>
            </select>

            <div id="produtos"></div>

        </section>


        <section id="pedido" class="pedido">

            <h2>🛒 Meu Pedido</h2>

            <!-- Dados do Cliente -->
            <div class="dados-cliente" style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #ddd;">
                <h3>Identificação do Cliente</h3>
                <div style="margin-top: 8px;">
                    <label for="nomeCliente"><strong>Nome do Cliente:</strong></label><br>
                    <input type="text" id="nomeCliente" placeholder="Digite seu nome" style="width: 100%; padding: 6px; margin-top: 4px;">
                </div>
                <div style="margin-top: 8px;">
                    <label for="numeroMesa"><strong>Número da Mesa:</strong></label><br>
                    <input type="number" id="numeroMesa" placeholder="Ex: 5" style="width: 100%; padding: 6px; margin-top: 4px;">
                </div>
            </div>

            <div id="listaPedido"></div>

            <p>
                Subtotal:
                R$ <span id="subtotal">0.00</span>
            </p>

            <label>
                <input type="checkbox" id="garcom">
                Acrescentar 10% do garçom
            </label>

            <p>
                Garçom:
                R$ <span id="valorGarcom">0.00</span>
            </p>

            <h2>
                Total:
                R$ <span id="total">0.00</span>
            </h2>

            <!-- BOTÃO FINALIZAR PEDIDO -->
            <button onclick="finalizarPedido()" style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px;">
                FINALIZAR PEDIDO
            </button>

        </section>

    </main>

        let pedido = [];

        const divProdutos = document.getElementById('produtos');
        const inputPesquisa = document.getElementById('pesquisa');
        const selectFiltro = document.getElementById('filtro');
        const listaPedido = document.getElementById('listaPedido');
        const spanSubtotal = document.getElementById('subtotal');
        const checkGarcom = document.getElementById('garcom');
        const spanValorGarcom = document.getElementById('valorGarcom');
        const spanTotal = document.getElementById('total');

        function renderizarProdutos(lista) {
            divProdutos.innerHTML = '';
            
            if (lista.length === 0) {
                divProdutos.innerHTML = '<p>Nenhum produto encontrado.</p>';
                return;
            }

            lista.forEach(produto => {
                const card = document.createElement('div');
                card.innerHTML = `
                    <h3>${produto.nome}</h3>
                    <p>${produto.descricao}</p>
                    <p>R$ ${produto.preco.toFixed(2).replace('.', ',')}</p>
                    <button onclick="adicionarAoPedido(${produto.id})">Adicionar</button>
                    
                `;
                divProdutos.appendChild(card);
            });
        }

        function filtrarProdutos() {
            const termo = inputPesquisa.value.toLowerCase();
            const categoriaSelecionada = selectFiltro.value;

            const produtosFiltrados = produtos.filter(produto => {
                const correspondeCategoria = (categoriaSelecionada === 'todos' || produto.categoria === categoriaSelecionada);
                const correspondeTermo = produto.nome.toLowerCase().includes(termo) || produto.descricao.toLowerCase().includes(termo);
                return correspondeCategoria && correspondeTermo;
            });

            renderizarProdutos(produtosFiltrados);
        }

        function adicionarAoPedido(id) {
            const produto = produtos.find(p => p.id === id);
            const itemExistente = pedido.find(item => item.id === id);

            if (itemExistente) {
                itemExistente.quantidade++;
            } else {
                pedido.push({ ...produto, quantidade: 1 });
            }

            atualizarPedido();
        }

        function alterarQuantidade(id, quantidade) {
            const item = pedido.find(p => p.id === id);
            if (item) {
                item.quantidade += quantidade;
                if (item.quantidade <= 0) {
                    pedido = pedido.filter(p => p.id !== id);
                }
            }
            atualizarPedido();
        }

        function atualizarPedido() {
            listaPedido.innerHTML = '';
            let subtotal = 0;

            if (pedido.length === 0) {
                listaPedido.innerHTML = '<p>Seu pedido está vazio.</p>';
            } else {
                pedido.forEach(item => {
                    const totalItem = item.preco * item.quantidade;
                    subtotal += totalItem;

                    const divItem = document.createElement('div');
                    divItem.innerHTML = `
                        <p><strong>Nome do produto:</strong> ${item.nome}</p>
                        <p><strong>Quantidade:</strong> ${item.quantidade}</p>
                        <p><strong>Valor unitário:</strong> R$ ${item.preco.toFixed(2).replace('.', ',')}</p>
                        <p><strong>Valor total do item:</strong> R$ ${totalItem.toFixed(2).replace('.', ',')}</p>
                        <button onclick="alterarQuantidade(${item.id}, -1)">-</button>
                        <button onclick="alterarQuantidade(${item.id}, 1)">+</button>
                        <hr>
                    `;
                    listaPedido.appendChild(divItem);
                });
            }

            spanSubtotal.textContent = subtotal.toFixed(2).replace('.', ',');

            const valorGarcom = checkGarcom.checked ? subtotal * 0.10 : 0;
            spanValorGarcom.textContent = valorGarcom.toFixed(2).replace('.', ',');

            const totalGeral = subtotal + valorGarcom;
            spanTotal.textContent = totalGeral.toFixed(2).replace('.', ',');
        }

        // NOVO REQUISITO: Função simples para Finalizar Pedido
        function finalizarPedido() {
            const nomeCliente = document.getElementById('nomeCliente').value.trim();
            const numeroMesa = document.getElementById('numeroMesa').value.trim();

            if (!nomeCliente || !numeroMesa) {
                alert('Por favor, preencha o Nome do Cliente e o Número da Mesa antes de finalizar!');
                return;
            }

            if (pedido.length === 0) {
                alert('Seu pedido está vazio! Adicione produtos antes de finalizar.');
                return;
            }

            let resumo = `=== RESUMO DO PEDIDO ===\n\n`;
            resumo += `Cliente: ${nomeCliente}\n`;
            resumo += `Mesa: ${numeroMesa}\n\n`;
            resumo += `Produtos Escolhidos:\n`;

            pedido.forEach(item => {
                const totalItem = (item.preco * item.quantidade).toFixed(2).replace('.', ',');
                resumo += `- ${item.quantidade}x ${item.nome} (R$ ${totalItem})\n`;
            });

            resumo += `\nSubtotal: R$ ${spanSubtotal.textContent}\n`;
            resumo += `Taxa do Garçom (10%): R$ ${spanValorGarcom.textContent}\n`;
            resumo += `Valor Total: R$ ${spanTotal.textContent}`;

            alert(resumo);
        }

        inputPesquisa.addEventListener('input', filtrarProdutos);
        selectFiltro.addEventListener('change', filtrarProdutos);
        checkGarcom.addEventListener('change', atualizarPedido);

        renderizarProdutos(produtos);
    </script>
